<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Bumi & Antariksa - JAMIKA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1b 100%);
            color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Stage 16:9 sebesar mungkin di viewport (desktop = full layar) */
        .embed-container {
            position: relative;
            width: min(100vw, calc(100vh * 16 / 9));
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background-color: #000;
        }

        /* Trik crop simetris: iframe ditinggikan 2x64px lalu digeser 64px ke atas.
           Canva me-letterbox desain di tengah, jadi slide tetap utuh sementara
           bar kontrol & strip progress di bawah terpotong keluar stage. */
        .embed-container iframe {
            position: absolute;
            left: 0;
            top: -64px;
            width: 100%;
            height: calc(100% + 128px);
            border: none;
            padding: 0;
            margin: 0;
        }

        .info-section {
            display: none; /* disembunyikan di desktop (mode full layar) */
            text-align: center;
            padding: 10px 20px;
            font-size: 14px;
            color: #b3b3b3;
            line-height: 1.6;
        }

        .info-section a {
            color: #4fc3f7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .info-section a:hover {
            color: #81d4fa;
            text-decoration: underline;
        }

        .author {
            margin-top: 5px;
            font-size: 13px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        /* Mobile & tablet: kartu responsif 16:9 + info credits */
        @media (max-width: 1023px) {
            body {
                height: auto;
                min-height: 100vh;
                overflow: auto;
                padding: 16px;
            }

            .container {
                height: auto;
                gap: 16px;
            }

            .embed-container {
                width: 100%;
                border-radius: 10px;
                border: 1px solid rgba(255, 255, 255, 0.1);
                box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
            }

            .info-section {
                display: block;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .embed-container {
                border-radius: 8px;
            }
            .info-section {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Responsive Canva Embed -->
    <div class="embed-container">
        <iframe
            loading="lazy"
            src="https://www.canva.com/design/DAHQMuYTiGk/bx6xHcaBWfR7eog-q35jGw/view?embed"
            allowfullscreen="allowfullscreen"
            allow="fullscreen"
        ></iframe>
    </div>

    <!-- Info & Credits -->
    <div class="info-section">
        <p>
            <a href="https://www.canva.com/design/DAHQMuYTiGk/bx6xHcaBWfR7eog-q35jGw/view?utm_content=DAHQMuYTiGk&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">
                JAMIKA - Jelajah Bumi &amp; Antariksa
            </a>
        </p>
        <p class="author">oleh OKEU SANTIKA</p>
    </div>
</div>

</body>
</html>
