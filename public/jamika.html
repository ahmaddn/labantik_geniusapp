<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jelajah Bumi & Antariksa - JAMIKA</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #0f0f1b 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Responsive Embed Container */
        .embed-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background-color: #000;
            will-change: transform;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .embed-container:hover {
            transform: translateY(-2px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
        }

        .embed-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }

        .info-section {
            text-align: center;
            padding: 10px 20px;
            font-size: 14px;
            color: #b3b3b3;
            line-height: 1.6;
        }

        .info-section a {
            color: #4fc3f7;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .info-section a:hover {
            color: #81d4fa;
            text-decoration: underline;
        }

        .author {
            margin-top: 5px;
            font-size: 13px;
            opacity: 0.8;
            letter-spacing: 0.5px;
        }

        /* Extra support for small screens */
        @media (max-width: 600px) {
            body {
                padding: 12px;
            }
            .embed-container {
                border-radius: 8px;
            }
            .info-section {
                font-size: 12px;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Responsive Canva Embed -->
    <div class="embed-container">
        <iframe
            loading="lazy"
            src="https://www.canva.com/design/DAHQMuYTiGk/bx6xHcaBWfR7eog-q35jGw/view?embed"
            allowfullscreen="allowfullscreen"
            allow="fullscreen"
        ></iframe>
    </div>

    <!-- Info & Credits -->
    <div class="info-section">
        <p>
            <a href="https://www.canva.com/design/DAHQMuYTiGk/bx6xHcaBWfR7eog-q35jGw/view?utm_content=DAHQMuYTiGk&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link" target="_blank" rel="noopener">
                Rev Salinan dari Okeu_JAMIKA_Jelajah Bumi &amp; Antariksa
            </a>
        </p>
        <p class="author">oleh OKEU SANTIKA</p>
    </div>
</div>

</body>
</html>
